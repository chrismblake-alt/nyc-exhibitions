<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYC Museum Exhibitions</title>
<meta name="description" content="What's on now, opening soon and ending soon at New York City museums.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC Exhibitions">
<meta name="theme-color" content="#8a1fa3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Major+Mono+Display&display=swap">
<style>
/* Every choice here was drawn at random: mono display type, typewriter body, saturated purple ground (hue 289),
   orange (25) and blue (241) accents, masonry columns, blob photos, dashed borders, full-round corners,
   centered hero, rotated section labels, slow color cycle. */
:root{
  --ground:hsl(289 70% 34%); --ground-a:hsl(262 68% 36%); --ground-b:hsl(316 68% 34%);
  --paper:hsl(289 70% 96%); --ink:hsl(289 60% 12%); --soft:hsl(289 22% 34%);
  --cream:hsl(40 100% 96%); --orange:hsl(25 100% 56%); --orange-ink:hsl(25 100% 33%);
  --blue:hsl(241 78% 52%); --blue-pale:hsl(241 90% 90%);
  --display:"Major Mono Display","Courier New",monospace;
  --body:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:cycle 48s ease-in-out infinite}
@keyframes cycle{0%,100%{background:var(--ground)}33%{background:var(--ground-a)}66%{background:var(--ground-b)}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:36px 64px;display:flex;flex-direction:column;gap:34px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7.4vw,4.2rem);line-height:1.02;margin:0;text-wrap:balance;max-width:14ch}
h1 em{font-style:normal;color:var(--orange)}
.sub{margin:0;max-width:46ch}
.bar{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
#q{width:100%;max-width:520px;font:inherit;padding:12px 20px;border:2px dashed var(--cream);border-radius:999px;background:transparent;color:var(--cream);text-align:center}
#q::placeholder{color:var(--cream);opacity:.75}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{font:700 .85rem var(--body);padding:8px 14px;border:2px dashed var(--cream);border-radius:999px;background:transparent;color:var(--cream);cursor:pointer}
.chip.mood{font-style:italic;font-weight:400;border-color:var(--orange)}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-style:solid;border-color:var(--cream)}
.chip.mood[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
#out{display:flex;flex-direction:column;gap:44px}
section{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:10px}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1;margin:0;writing-mode:vertical-rl;transform:rotate(180deg);
  justify-self:center;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);white-space:nowrap}
h2 span{font-family:var(--body);font-size:.9rem;color:var(--orange);margin-top:.6em}
.cols{columns:270px;column-gap:18px}
.card{display:flex;flex-direction:column;gap:6px;break-inside:avoid;margin:0 0 18px;padding:22px 22px 24px;background:var(--paper);color:var(--ink);
  border:2px dashed var(--ink);border-radius:40px;text-decoration:none}
.card:hover{border-style:solid;border-color:var(--blue)}
.pic{position:relative;width:100%;aspect-ratio:5/4;margin-bottom:8px;overflow:hidden;background:var(--blue);color:var(--blue-pale);
  display:grid;place-items:center;font:400 1rem var(--display);text-align:center;padding:12px;
  border-radius:58% 42% 63% 37% / 45% 60% 40% 55%}
.card:nth-child(3n+2) .pic{border-radius:37% 63% 44% 56% / 62% 38% 62% 38%}
.card:nth-child(3n) .pic{border-radius:66% 34% 52% 48% / 38% 55% 45% 62%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.4) saturate(1.25)}
.m{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.t{font-family:var(--body);font-weight:700;font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.h{font-style:italic;color:var(--orange-ink);line-height:1.35}
.d{color:var(--soft);font-size:.92rem}
.tag{align-self:flex-start;margin-top:4px;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:999px;border:2px dashed currentColor}
.tag.u{color:var(--orange-ink)} .tag.s{color:var(--blue)}
.empty{margin:0;text-align:center;padding:24px;border:2px dashed var(--cream);border-radius:999px}
footer{text-align:center;font-size:.88rem;opacity:.9}
footer p{margin:0 0 6px}
@media (max-width:520px){section{grid-template-columns:1.9rem minmax(0,1fr);gap:8px}h2{font-size:1.2rem}.card{border-radius:32px;padding:18px 18px 20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NYC Museum <em>Exhibitions</em></h1>
    <p class="sub">What's on at New York City museums. Pick a mood or a museum, then tap a show to open its page.</p>
    <div class="bar">
      <input id="q" type="search" placeholder="Search exhibitions" aria-label="Search exhibitions">
      <div class="chips" id="moods" aria-label="Pick a mood"></div>
      <div class="chips" id="chips" aria-label="Pick a museum"></div>
    </div>
  </header>
  <div id="out"><p class="empty">Loading listings…</p></div>
  <footer>
    <p id="stamp"></p>
    <p>Listings and images come from each museum's website. Confirm dates before you go.</p>
  </footer>
</div>
<script>
const DAY=864e5, now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const pd=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(d,yr)=>d.toLocaleDateString("en-US",{month:"short",day:"numeric",...(yr||d.getFullYear()!==today.getFullYear()?{year:"numeric"}:{})});
const days=d=>Math.round((d-today)/DAY);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const far=new Date(9999,0,1);
const G=[["end","Ending Soon",(a,b)=>a.E-b.E],["open","Opening Soon",(a,b)=>a.S-b.S],["now","On Now",(a,b)=>(a.E||far)-(b.E||far)],["later","Later",(a,b)=>a.S-b.S]];
const MOODS={date:"Date night",blue:"Feeling melancholy",kids:"With kids",fun:"Need a laugh",deep:"Want to think"};
const chips=document.getElementById("chips"),moodsEl=document.getElementById("moods"),out=document.getElementById("out"),q=document.getElementById("q");
let items=[],museums={},pick="all",mood="";
try{pick=localStorage.getItem("museum")||"all"}catch(e){}

function prep(x){
  const S=pd(x.start),E=pd(x.end);let g,tag="",cls="";
  if(E&&E<today)return null;
  if(S&&S>today){const n=days(S);g=n<=45?"open":"later";if(n<=45){tag=n===1?"Opens tomorrow":"Opens in "+n+" days";cls="s"}}
  else if(E&&days(E)<=30){const n=days(E);g="end";tag=n===0?"Closes today":n===1?"1 day left":n+" days left";cls="u"}
  else g="now";
  let d;
  if(g==="open"||g==="later")d=E?fmt(S)+" – "+fmt(E,1):"Opens "+fmt(S)+(x.note?" · "+x.note:"");
  else d=E?"Through "+fmt(E):(x.note||"Ongoing");
  return{...x,S,E,g,tag,cls,d};
}
function draw(){
  if(pick!=="all"&&!museums[pick])pick="all";
  moodsEl.innerHTML=Object.entries(MOODS).map(([k,n])=>`<button class="chip mood" type="button" data-k="${k}" aria-pressed="${k===mood}">${n}</button>`).join("");
  chips.innerHTML=[["all","All museums"],...Object.entries(museums)].map(([k,n])=>`<button class="chip" type="button" data-k="${esc(k)}" aria-pressed="${k===pick}">${esc(n)}</button>`).join("");
  const term=q.value.trim().toLowerCase();
  const list=items.filter(x=>(pick==="all"||x.museum===pick)&&(!mood||x.mood===mood)&&(!term||(x.title+" "+x.venue+" "+(x.hook||"")).toLowerCase().includes(term)));
  out.innerHTML=G.map(([k,name,sort])=>{
    const rows=list.filter(x=>x.g===k).sort(sort);
    if(!rows.length)return"";
    return`<section><h2>${name} <span>${rows.length}</span></h2><div class="cols">`+rows.map(x=>{
      const n=esc(museums[x.museum]||"");
      return `<a class="card" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="pic">${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode(this.dataset.n))" data-n="${n}">`:n}</span>`+
      `<span class="m">${esc(x.venue)}</span><span class="t">${esc(x.title)}</span>${x.hook?`<span class="h">${esc(x.hook)}</span>`:""}<span class="d">${x.d}</span>${x.tag?`<span class="tag ${x.cls}">${x.tag}</span>`:""}</a>`;
    }).join("")+"</div></section>";
  }).join("")||'<p class="empty">No exhibitions match. Clear the search or pick another museum or mood.</p>';
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;pick=b.dataset.k;try{localStorage.setItem("museum",pick)}catch(e){}draw()});
moodsEl.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;mood=mood===b.dataset.k?"":b.dataset.k;draw()});
q.addEventListener("input",draw);
fetch("data/exhibitions.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
  museums=data.museums||{};
  items=(data.items||[]).map(prep).filter(Boolean);
  if(data.updated)document.getElementById("stamp").textContent="Last updated "+new Date(data.updated).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+".";
  draw();
}).catch(()=>{out.innerHTML='<p class="empty">The listings could not be loaded. Reload the page to try again.</p>'});
</script>
</body>
</html>
