<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYC Museum Exhibitions</title>
<meta name="description" content="What's on now, opening soon and ending soon at New York City museums.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC Exhibitions">
<meta name="theme-color" content="#14122b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,600;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Direction: the museum after hours, drawn as a floor plan. Shows are rooms that share walls,
   sections are numbered galleries, moods are the map legend, and the light is the pale violet
   of a gas-discharge tube with one gold marker. */
:root{
  --night:#14122b; --room:#1b1938; --wall:#6f69b8; --glow:#c3beff; --text:#f1efff; --muted:#aaa6cf;
  --gold:#f2c14e; --gold-ink:#1d1603;
  --date:#ff9dbb; --blue:#93bcff; --kids:#a3e495; --fun:#f2c14e; --deep:#cfaeff;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:40px 72px;display:flex;flex-direction:column;gap:44px}

header{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 48px;align-items:end}
.here{display:inline-flex;align-items:center;gap:10px;font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.here i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(242,193,78,.22)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:1.02;margin:0;text-wrap:balance;
  text-shadow:0 0 28px rgba(195,190,255,.45)}
.sub{margin:16px 0 0;color:var(--muted);max-width:44ch;font-size:1.05rem}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
#q{width:100%;font:inherit;padding:13px 16px;border:1px solid var(--wall);border-radius:2px;background:var(--room);color:var(--text)}
#q::placeholder{color:var(--muted)}
.key{display:flex;flex-direction:column;gap:8px}
.key b{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 .95rem var(--body);padding:8px 13px;border:1px solid var(--wall);border-radius:2px;background:transparent;color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--glow)}
.chip[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:var(--night)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--glow))}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--night)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#out{display:flex;flex-direction:column;gap:56px}
.gal{display:flex;flex-direction:column;gap:18px}
.gal-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--wall);padding-bottom:12px}
.num{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--glow);min-width:1.6ch;text-shadow:0 0 18px rgba(195,190,255,.5)}
.gal-head small{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:0}
.count{margin-left:auto;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px}
.room{position:relative;display:flex;flex-direction:column;background:var(--room);box-shadow:0 0 0 1px var(--wall);color:inherit;text-decoration:none;min-width:0}
.room:hover{background:#221f47}
.room::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;border-top:1px solid var(--wall);border-left:1px solid var(--wall);border-top-left-radius:26px;opacity:.8}
.pic{position:relative;aspect-ratio:16/10;background:#262354;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:1.15rem;text-align:center;padding:10px;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.txt{display:flex;flex-direction:column;gap:7px;padding:16px 18px 30px;min-width:0}
.m{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.t{font-family:var(--display);font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.room:hover .t{color:var(--glow)}
.h{font-style:italic;color:var(--glow);line-height:1.4}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:4px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-weight:700;font-size:.82rem;padding:2px 8px;border-radius:2px}
.tag.u{background:var(--gold);color:var(--gold-ink)} .tag.s{border:1px solid var(--glow);color:var(--glow)}
.mood{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted)}
.empty{margin:0;padding:22px;border:1px solid var(--wall);color:var(--muted)}
footer{color:var(--muted);font-size:.9rem;border-top:1px solid var(--wall);padding-top:18px}
footer p{margin:0 0 6px}
@media (max-width:820px){header{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="here"><i></i><span id="today">You are here</span></p>
      <h1>NYC Museum Exhibitions</h1>
      <p class="sub">A floor plan of what's showing across the city. Pick a mood from the legend, then step into a room.</p>
    </div>
    <div class="panel">
      <input id="q" type="search" placeholder="Search exhibitions" aria-label="Search exhibitions">
      <div class="key"><b>Legend: pick a mood</b><div class="chips" id="moods"></div></div>
      <div class="key"><b>Museums</b><div class="chips" id="chips"></div></div>
    </div>
  </header>
  <div id="out"><p class="empty">Loading listings…</p></div>
  <footer>
    <p id="stamp"></p>
    <p>Listings and images come from each museum's website. Confirm dates before you go.</p>
  </footer>
</div>
<script>
const DAY=864e5, now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const pd=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(d,yr)=>d.toLocaleDateString("en-US",{month:"short",day:"numeric",...(yr||d.getFullYear()!==today.getFullYear()?{year:"numeric"}:{})});
const days=d=>Math.round((d-today)/DAY);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const far=new Date(9999,0,1);
const G=[["end","Ending Soon",(a,b)=>a.E-b.E],["now","On Now",(a,b)=>(a.E||far)-(b.E||far)],["open","Opening Soon",(a,b)=>a.S-b.S],["later","Later",(a,b)=>a.S-b.S]];
const ROMAN=["I","II","III","IV"];
const MOODS={date:"Date night",blue:"Feeling melancholy",kids:"With kids",fun:"Need a laugh",deep:"Want to think"};
const chips=document.getElementById("chips"),moodsEl=document.getElementById("moods"),out=document.getElementById("out"),q=document.getElementById("q");
let items=[],museums={},pick="all",mood="";
try{pick=localStorage.getItem("museum")||"all"}catch(e){}
document.getElementById("today").textContent="You are here · "+today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

function prep(x){
  const S=pd(x.start),E=pd(x.end);let g,tag="",cls="";
  if(E&&E<today)return null;
  if(S&&S>today){const n=days(S);g=n<=45?"open":"later";if(n<=45){tag=n===1?"Opens tomorrow":"Opens in "+n+" days";cls="s"}}
  else if(E&&days(E)<=30){const n=days(E);g="end";tag=n===0?"Closes today":n===1?"1 day left":n+" days left";cls="u"}
  else g="now";
  let d;
  if(g==="open"||g==="later")d=E?fmt(S)+" – "+fmt(E,1):"Opens "+fmt(S)+(x.note?" · "+x.note:"");
  else d=E?"Through "+fmt(E):(x.note||"Ongoing");
  return{...x,S,E,g,tag,cls,d};
}
const dot=k=>`<i class="dot" style="--c:var(--${k})"></i>`;
function draw(){
  if(pick!=="all"&&!museums[pick])pick="all";
  moodsEl.innerHTML=Object.entries(MOODS).map(([k,n])=>`<button class="chip" type="button" data-k="${k}" aria-pressed="${k===mood}">${dot(k)}${n}</button>`).join("");
  chips.innerHTML=[["all","All"],...Object.entries(museums)].map(([k,n])=>`<button class="chip" type="button" data-k="${esc(k)}" aria-pressed="${k===pick}">${esc(n)}</button>`).join("");
  const term=q.value.trim().toLowerCase();
  const list=items.filter(x=>(pick==="all"||x.museum===pick)&&(!mood||x.mood===mood)&&(!term||(x.title+" "+x.venue+" "+(x.hook||"")).toLowerCase().includes(term)));
  let n=0;
  out.innerHTML=G.map(([k,name,sort])=>{
    const rows=list.filter(x=>x.g===k).sort(sort);
    if(!rows.length)return"";
    return`<section class="gal"><div class="gal-head"><span class="num" aria-hidden="true">${ROMAN[n++]}</span><div><small>Gallery</small><h2>${name}</h2></div><span class="count">${rows.length} ${rows.length===1?"show":"shows"}</span></div><div class="plan">`+rows.map(x=>{
      const m=esc(museums[x.museum]||"");
      return `<a class="room" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="pic">${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode(this.dataset.n))" data-n="${m}">`:m}</span>`+
      `<span class="txt"><span class="m">${esc(x.venue)}</span><span class="t">${esc(x.title)}</span>${x.hook?`<span class="h">${esc(x.hook)}</span>`:""}`+
      `<span class="meta">${x.tag?`<span class="tag ${x.cls}">${x.tag}</span>`:""}<span>${x.d}</span>${MOODS[x.mood]?`<span class="mood">${dot(x.mood)}${MOODS[x.mood]}</span>`:""}</span></span></a>`;
    }).join("")+"</div></section>";
  }).join("")||'<p class="empty">No exhibitions match. Clear the search or pick another museum or mood.</p>';
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;pick=b.dataset.k;try{localStorage.setItem("museum",pick)}catch(e){}draw()});
moodsEl.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;mood=mood===b.dataset.k?"":b.dataset.k;draw()});
q.addEventListener("input",draw);
fetch("data/exhibitions.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
  museums=data.museums||{};
  items=(data.items||[]).map(prep).filter(Boolean);
  if(data.updated)document.getElementById("stamp").textContent="Last updated "+new Date(data.updated).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+".";
  draw();
}).catch(()=>{out.innerHTML='<p class="empty">The listings could not be loaded. Reload the page to try again.</p>'});
</script>
</body>
</html>
